<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Лабиринт — шарик</title>

  <!-- Telegram WebApp SDK (вне Telegram просто ничего не делает) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css" />

  <!-- Three.js как ES-модули через import map (без установки и сборки) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- 3D-сцена (квадратная, сверху) -->
    <div id="scene-host"></div>

    <!-- Кнопки поверх сцены -->
    <div id="hud">
      <button id="btn-gyro" class="hud-btn" type="button">Гироскоп: выкл</button>
      <button id="btn-settings" class="hud-btn" type="button">Настройки</button>
    </div>

        <!-- Джойстик (снизу по центру) -->
    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>

    <!-- Панель настроек -->
    <div id="settings" class="panel hidden">
      <h2>Настройки</h2>

      <label class="row">
        <span>Скорость шарика <b id="val-speed"></b></span>
        <input type="range" id="set-speed" min="0.2" max="5" step="0.05" value="3" />
      </label>

      <label class="row">
        <span>Сопротивление (трение) <b id="val-friction"></b></span>
        <input type="range" id="set-friction" min="0" max="2" step="0.05" value="0.15" />
      </label>

      <label class="row">
        <span>Скорость наклона <b id="val-tilt-speed"></b></span>
        <input type="range" id="set-tilt-speed" min="0.5" max="10" step="0.1" value="6" />
      </label>

            <label class="row">
        <span>Макс. угол наклона <b id="val-max-tilt"></b></span>
        <input type="range" id="set-max-tilt" min="4" max="30" step="1" value="14" />
      </label>

      <label class="row">
        <span>Размер шарика <b id="val-ball-size"></b></span>
        <input type="range" id="set-ball-size" min="0.1" max="0.45" step="0.01" value="0.22" />
      </label>

      <button id="btn-settings-close" class="hud-btn wide" type="button">Закрыть</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
